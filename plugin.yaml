name: klipper-print-watch
version: 0.2.0
manifest_version: 2
requires_hermes: ">=0.21.6"
description: >-
  Each watch run costs 0 tokens, and the unmanned run holds no tools.
  Watch a Klipper printer from Hermes, built on the Moonraker HTTP API.
  Read print state, progress, temperatures and a slicer time estimate.
  Save a webcam still only inside this plugin's data directory, and only
  when the download is complete and within the size cap. A short or
  oversized body is discarded. A path outside that directory is not saved.
  While a person is in the session, pause, resume, and cancel return one pre_tool_call approve line.
  Hermes shows it and asks before the POST. yolo and approvals off skip
  the prompt. Choosing always adds one command_allowlist line in config.yaml.
  For pause and resume that line covers only the same action at the same
  Moonraker origin, and only while a person is in the session. Cancel asks
  every time. Its rule_key changes on each call, so a saved always line does
  not approve the next cancel. cron, hermes -q, webhook, and a
  plugins.isolation host process still refuse the move, including after always.
  If it is already that state, nothing is sent.
  While the plugin is enabled, its skill adds one line to the skills index
  of every session, including surfaces where the tools are turned off.
  schedule writes a script under HERMES_HOME/scripts and creates one cron job
  that does not call a model. Empty script output sends nothing. Running
  schedule again switches an existing job to that script. A job made by 0.1.x
  keeps its model turn until that next schedule, and this version does not
  narrow other tools on that leftover job. Removing the plugin leaves the
  script job. Run hermes klipper-print-watch unschedule first, or hermes cron
  remove after.
  A cron watch can report klippy_shutdown (Klipper itself stopped, printing
  or not), complete, error, paused (only when the previous state was
  printing and Klipper is running), cancelled, and stalled. An unreachable
  printer is reported once per cause, then daily.
  The watch does not move the printer. The scheduled script does not call
  the vision model. Camera failure checks are off unless you enable them,
  and even then they run only when klipper_watch itself runs on a cron turn.
  They do not cancel the print.
author: TakeshiTGAL
license: MIT
homepage: https://github.com/TakeshiTGAL/hermes-plugin-klipper-print-watch
tags: [klipper, moonraker, printer, cron]
provides_tools:
  - klipper_status
  - klipper_control
  - klipper_watch
provides_hooks:
  - pre_tool_call
requires_env:
  - name: MOONRAKER_URL
    description: "Single Moonraker base URL, for example http://printer.example:7125. No path, query, or userinfo."
    prompt: "Moonraker base URL"
    secret: false
    password: false
optional_env:
  - name: MOONRAKER_API_KEY
    description: "API key for an untrusted client. Sent only as the X-Api-Key header. Leave empty when this machine is in Moonraker trusted_clients."
    prompt: "Moonraker API key (or empty if this host is trusted)"
    secret: true
    password: true
config_schema:
  stall_minutes:
    type: int
    default: 10
    label: Minutes before a stall
    description: >-
      While print_stats.state is printing, a watch tick reports a stall only
      when file_position is a number and the file position, progress, and
      filename have all stayed the same for this many minutes. A missing
      file_position is not a stall. Clamped to 1-240. Tool arguments cannot
      change it.
  vision_check:
    type: bool
    default: false
    label: Ask your model if a still looks failed
    description: >-
      Off by default. When true, each klipper_watch tick saves one webcam still
      and makes one ctx.llm image call. failed and not_failed are recorded only
      when the model says so. If it cannot tell, the reply says so and names the
      still and the time. That is not a pass. Nothing here pauses or cancels.
      The printer moves only through klipper_control after approval.
  snapshot_max_bytes:
    type: int
    default: 2000000
    label: Largest webcam still to keep
    description: >-
      Bytes. Clamped to 1-5000000. A larger download (or a larger declared
      Content-Length), or one shorter than Content-Length, is discarded and not
      saved. Tool arguments cannot raise it.
